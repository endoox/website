# Copies the site's runtime secrets from GitHub (synced there from Doppler endo/landing) to the
# endo-website Cloudflare Worker. Doppler can't sync to Workers directly, only to Pages.
#
# Run it from the Actions tab after changing a secret in Doppler, or let Doppler trigger it with a
# webhook (repository_dispatch, event type "doppler-secrets-changed").
#
# Reads the Production environment's secrets, including CLOUDFLARE_API_TOKEN (a Cloudflare API token
# from the "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.
name: Sync secrets to Cloudflare Worker

on:
  workflow_dispatch:
  repository_dispatch:
    types: [doppler-secrets-changed]

permissions:
  contents: read

concurrency:
  group: sync-worker-secrets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Doppler syncs into this environment's secrets, which a job only sees if it names the environment.
    environment: Production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Doppler fires its webhook and its GitHub sync at the same time; give the sync a moment to land.
      - if: github.event_name == 'repository_dispatch'
        run: sleep 60

      - name: Push secrets to the Worker
        # Explicit bash adds pipefail, so a missing secret stops the step before Wrangler runs.
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Every secret the site reads at runtime. Add new ones here and in the list below.
          ATTIO_API_KEY: ${{ secrets.ATTIO_API_KEY }}
          CALENDLY_WEBHOOK_SIGNING_KEY: ${{ secrets.CALENDLY_WEBHOOK_SIGNING_KEY }}
        run: |
          node -e '
            const names = ["ATTIO_API_KEY", "CALENDLY_WEBHOOK_SIGNING_KEY"];
            const missing = ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID", ...names].filter((name) => !process.env[name]);
            if (missing.length) {
              console.error(`Missing Production environment secrets: ${missing.join(", ")}`);
              process.exit(1);
            }
            process.stdout.write(JSON.stringify(Object.fromEntries(names.map((name) => [name, process.env[name]]))));
          ' | npx --yes wrangler@4.147.0 secret bulk --name endo-website
